# Quét secret bằng gitleaks CLI (bản mã nguồn mở, không cần license).
# Cấu hình bổ sung (allowlist) đặt ở .gitleaks.toml nếu cần.

name: Secret Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.18.4"   # cập nhật định kỳ: https://github.com/gitleaks/gitleaks/releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cài gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Quét toàn bộ lịch sử
        run: gitleaks detect --source . --redact --verbose --no-banner
